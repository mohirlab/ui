version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Give new releases time to be vetted (and yanked if malicious) before we take them.
    cooldown:
      default-days: 7
    groups:
      vanilla-extract:
        patterns: ['@vanilla-extract/*']
      storybook:
        patterns: ['storybook', '@storybook/*']
      oxc:
        patterns: ['oxlint', 'oxfmt', 'tsdown', 'rolldown']
      tooling:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
