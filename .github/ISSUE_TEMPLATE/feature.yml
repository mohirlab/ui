name: Feature or component request
description: Propose a component, token, icon or API.
labels: ['type: feature', 'status: triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: Describe the product need first, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: API sketch, screenshots, references. Note the mobile behaviour too.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions.
          required: true
