name: Release

# Publishing uses npm trusted publishing (OIDC). There is no NPM_TOKEN secret:
# npm is retiring direct publishing with 2FA-bypass tokens (around January 2027),
# and short-lived OIDC credentials also give every release a provenance attestation.
#
# One-time setup per package (first manual publish, then the trusted publisher on npmjs.com):
# see docs/maintainers.md.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # version commits and tags
  pull-requests: write # the "Version packages" PR
  id-token: write # OIDC token for npm trusted publishing

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  release:
    runs-on: ubuntu-latest
    # Must match the environment on the npm trusted publisher. Only main may deploy to it.
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Open the version PR, or publish once it is merged
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # A green publish step is not proof: confirm every released version is on npm
      # with provenance. Retries for registry lag, then fails the run.
      - name: Verify the release on npm
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: node scripts/verify-published.mjs "$PUBLISHED"
